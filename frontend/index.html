<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Yield Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🌱 Crop Yield Prediction</h1>

    <p class="subtitle">
        Classical ML vs Quantum ML
    </p>


    <!-- INPUT CARD -->

    <div class="card">

        <h2>Enter Crop & Soil Information</h2>

        <div class="form-grid">

            <div>
                <label>Fertilizer</label>
                <input
                    type="number"
                    id="fertilizer"
                    placeholder="Example: 100"
                >
            </div>

            <div>
                <label>Temperature</label>
                <input
                    type="number"
                    step="0.01"
                    id="temp"
                    placeholder="Example: 25"
                >
            </div>

            <div>
                <label>Nitrogen (N)</label>
                <input
                    type="number"
                    id="N"
                    placeholder="Example: 90"
                >
            </div>

            <div>
                <label>Phosphorus (P)</label>
                <input
                    type="number"
                    id="P"
                    placeholder="Example: 40"
                >
            </div>

            <div>
                <label>Potassium (K)</label>
                <input
                    type="number"
                    id="K"
                    placeholder="Example: 40"
                >
            </div>

        </div>

        <button onclick="predict()">
            Predict Yield
        </button>

        <p id="loading"></p>

    </div>


    <!-- RESULTS -->

    <div class="results" id="results">

        <div class="result-card">

            <h3>Classical ML</h3>

            <p>Random Forest</p>

            <div class="value">
                <span id="rfResult">--</span>
            </div>

            <span>Yield</span>

        </div>


        <div class="result-card quantum">

            <h3>Quantum ML</h3>

            <p>RF + QKRR + VQR</p>

            <div class="value">
                <span id="quantumResult">--</span>
            </div>

            <span>Yield</span>

        </div>


        <div class="result-card difference">

            <h3>Difference</h3>

            <p>Quantum - Classical</p>

            <div class="value">
                <span id="differenceResult">--</span>
            </div>

            <span id="percentageResult">--</span>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
